[package]
name = "clipboard-superpowers"
version = "0.1.0"
description = "Clipboard Superpowers — fast offline clipboard manager (Tauri v2 + React)"
authors = ["Hoss (Operation Winter)"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboard_superpowers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
regex = "1.13.1"
arboard = "3.6.1"
base64 = { version = "0.23.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tauri-plugin-global-shortcut = "2.3.2"
enigo = "0.6"
tauri-plugin-autostart = "2.5.1"
clipboard-win = "5"
ammonia = "4"


# thin LTO: near-full-LTO size at a fraction of the link time (full LTO
# stalled 70+ min on this machine)
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
