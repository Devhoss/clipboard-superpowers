<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard Superpowers — Redesign Mockup</title>
<style>
  /* ============ design tokens (maps 1:1 to the real app's CSS vars) ====== */
  :root {
    --bg:            #ececf0;          /* backdrop behind the popup        */
    --surface:       rgba(255,255,255,.82); /* popup glass                */
    --card:          #ffffff;
    --card-hover:    #fbfbfd;
    --text:          #1d1d1f;
    --text-2:        #86868b;
    --hairline:      rgba(0,0,0,.07);
    --hairline-strong: rgba(0,0,0,.12);
    --fill:          rgba(120,120,128,.10);  /* iOS systemFill            */
    --fill-2:        rgba(120,120,128,.16);
    --accent:        #0a84ff;
    --accent-soft:   rgba(10,132,255,.12);
    --danger:        #ff3b30;
    --radius-win:    24px;
    --radius-card:   16px;
    --shadow-win:    0 32px 80px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.10);
    --shadow-card:   0 0 0 1px var(--hairline);
    --shadow-card-hover: 0 0 0 1px var(--hairline-strong), 0 8px 24px rgba(0,0,0,.07);
    --spring:        cubic-bezier(.2,.9,.25,1);
    --dot-plain:#98989d; --dot-link:#0a84ff; --dot-code:#bf5af2; --dot-color:#ff375f;
    --dot-email:#ff9f0a; --dot-image:#30d158; --dot-secret:#ff453a; --dot-file:#64d2ff;
  }
  .dark {
    --bg:            #101014;
    --surface:       rgba(30,30,34,.82);
    --card:          #232326;
    --card-hover:    #28282c;
    --text:          #f5f5f7;
    --text-2:        #98989d;
    --hairline:      rgba(255,255,255,.08);
    --hairline-strong: rgba(255,255,255,.16);
    --fill:          rgba(120,120,128,.18);
    --fill-2:        rgba(120,120,128,.26);
    --accent-soft:   rgba(10,132,255,.20);
    --shadow-win:    0 32px 90px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5);
    --shadow-card-hover: 0 0 0 1px var(--hairline-strong), 0 8px 24px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 700px at 20% -10%, #d7d7e2 0%, transparent 60%),
      radial-gradient(1000px 800px at 110% 110%, #cfd8e6 0%, transparent 55%),
      var(--bg);
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
    transition: background .4s;
  }
  .dark body {
    background:
      radial-gradient(1200px 700px at 20% -10%, #1c2030 0%, transparent 60%),
      radial-gradient(1000px 800px at 110% 110%, #14202c 0%, transparent 55%),
      var(--bg);
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ============ the popup window ========================================= */
  .window {
    width: 460px; height: 640px;
    display: flex; flex-direction: column;
    background: var(--surface);
    backdrop-filter: blur(40px) saturate(1.6);
    -webkit-backdrop-filter: blur(40px) saturate(1.6);
    border-radius: var(--radius-win);
    box-shadow: var(--shadow-win), inset 0 0 0 .5px rgba(255,255,255,.25);
    overflow: hidden;
    transition: background .4s;
  }

  /* titlebar */
  .titlebar {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 6px;
  }
  .titlebar .glow {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .titlebar h1 {
    font-size: 13px; font-weight: 650; letter-spacing: -.01em;
  }
  .titlebar .spacer { flex: 1; }
  .hotkey {
    font-size: 10.5px; color: var(--text-2);
    border: 1px solid var(--hairline); border-radius: 6px;
    padding: 2px 6px; letter-spacing: .02em;
  }
  .iconbtn {
    width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center;
    color: var(--text-2);
    transition: background .15s var(--spring), color .15s;
  }
  .iconbtn:hover { background: var(--fill); color: var(--text); }
  .iconbtn svg { width: 14px; height: 14px; }

  /* search */
  .searchwrap { flex: none; padding: 6px 14px 2px; }
  .search {
    display: flex; align-items: center; gap: 7px;
    background: var(--fill);
    border-radius: 10px; padding: 7px 10px;
    transition: box-shadow .2s, background .2s;
  }
  .search:focus-within { background: var(--fill-2); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { width: 13px; height: 13px; color: var(--text-2); flex: none; }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none;
    color: var(--text); font-size: 13px;
  }
  .search input::placeholder { color: var(--text-2); }
  .search .esc {
    font-size: 9.5px; color: var(--text-2);
    border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 4px;
  }

  /* category pills */
  .pills {
    flex: none;
    display: flex; gap: 6px; padding: 10px 14px 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    flex: none;
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 500;
    color: var(--text-2);
    background: var(--fill);
    border-radius: 999px; padding: 4px 10px;
    transition: all .18s var(--spring);
  }
  .pill:hover { background: var(--fill-2); color: var(--text); }
  .pill.active {
    background: var(--text); color: var(--surface);
  }
  .pill .pip { width: 6px; height: 6px; border-radius: 50%; }

  /* list */
  .list {
    flex: 1; overflow-y: auto;
    padding: 4px 12px 12px;
    display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: thin; scrollbar-color: var(--hairline-strong) transparent;
  }
  .list::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 4px; }

  /* ============ cards ===================================================== */
  .card {
    flex: none; /* flex-shrink:0 — overflow:hidden makes the auto min-size 0,
                   so the column flexbox would otherwise crush every card */
    background: var(--card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 11px 12px 12px;
    cursor: pointer;
    transition: box-shadow .2s var(--spring), background .2s, transform .2s var(--spring), opacity .25s, max-height .3s var(--spring), margin .3s, padding .3s;
    overflow: hidden;
  }
  .card:hover { background: var(--card-hover); box-shadow: var(--shadow-card-hover); }
  .card:active { transform: scale(.985); }
  .card.removing { opacity: 0; transform: scale(.95) translateY(-4px); max-height: 0 !important; padding-block: 0; margin-bottom: -8px; }

  .meta {
    display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .cat {
    font-size: 10px; font-weight: 650; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-2);
  }
  .meta .time { font-size: 10.5px; color: var(--text-2); }
  .meta .pinflag { width: 10px; height: 10px; color: #ff9f0a; display: none; }
  .card.pinned .pinflag { display: block; }
  .actions { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .card:hover .actions, .card:focus-within .actions { opacity: 1; }
  .action {
    width: 24px; height: 24px; border-radius: 7px;
    display: grid; place-items: center; color: var(--text-2);
    transition: background .15s, color .15s;
  }
  .action:hover { background: var(--fill-2); color: var(--text); }
  .action.danger:hover { background: rgba(255,59,48,.12); color: var(--danger); }
  .action svg { width: 13px; height: 13px; }
  .action.is-pinned { color: #ff9f0a; }

  .content { font-size: 13px; line-height: 1.45; color: var(--text); }
  .clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }

  .content.mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; font-size: 11.5px; line-height: 1.55; }

  .linktext { color: var(--accent); font-weight: 500; word-break: break-all; }
  .linkrow { display: flex; align-items: center; gap: 8px; }
  .favicon {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .favicon svg { width: 14px; height: 14px; }

  /* code card */
  .codeblock {
    background: color-mix(in srgb, var(--text) 4%, transparent);
    border-radius: 10px; padding: 9px 11px;
  }
  .tok-kw { color: #c678dd; } .tok-fn { color: #61afef; } .tok-str { color: #98c379; }
  .tok-num { color: #d19a66; } .tok-cm { color: #7f848e; font-style: italic; }
  .dark .tok-kw { color: #bf5af2; } .dark .tok-fn { color: #64a2ff; }
  .dark .tok-str { color: #30d158; } .dark .tok-num { color: #ff9f0a; } .dark .tok-cm { color: #98989d; }

  /* color card */
  .swatches { display: flex; gap: 8px; }
  .swatch { flex: 1; }
  .swatch .chip {
    height: 44px; border-radius: 10px;
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08);
  }
  .swatch .hex { font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--text-2); margin-top: 5px; text-align: center; letter-spacing: .03em; }

  /* secret card */
  .secretbox {
    display: flex; align-items: center; gap: 8px;
    background: color-mix(in srgb, var(--dot-secret) 8%, transparent);
    border-radius: 10px; padding: 9px 11px;
  }
  .secretval {
    flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", monospace; font-size: 11.5px;
    filter: blur(4px); user-select: none; transition: filter .25s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .secretval.revealed { filter: none; user-select: text; }
  .revealbtn {
    flex: none; font-size: 10.5px; font-weight: 600; color: var(--dot-secret);
    background: none; border-radius: 7px; padding: 3px 8px;
    transition: background .15s;
  }
  .revealbtn:hover { background: color-mix(in srgb, var(--dot-secret) 14%, transparent); }
  .ttl { font-size: 10px; color: var(--dot-secret); font-weight: 600; margin-top: 6px; }

  /* image card */
  .thumb {
    height: 96px; border-radius: 10px;
    background:
      radial-gradient(140px 90px at 80% 15%, #ffb56b 0%, transparent 60%),
      radial-gradient(200px 120px at 15% 90%, #6b8bff 0%, transparent 60%),
      linear-gradient(135deg, #2a2a5e, #7a4a8f 55%, #b05a7a);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.15);
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 6px 8px;
  }
  .thumb .res {
    font-size: 9.5px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.35); backdrop-filter: blur(8px);
    border-radius: 5px; padding: 2px 6px;
  }

  /* file card */
  .filerow { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
  .filerow + .filerow { border-top: 1px solid var(--hairline); }
  .fileicon {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--dot-file) 15%, transparent); color: var(--dot-file);
    font-size: 9px; font-weight: 700;
  }
  .filename { font-size: 12.5px; font-weight: 500; }
  .filesize { margin-left: auto; font-size: 10.5px; color: var(--text-2); }

  /* footer */
  .foot {
    flex: none; text-align: center;
    font-size: 10.5px; color: var(--text-2);
    padding: 6px 0 10px;
  }
  .foot button { color: var(--accent); font-weight: 500; }

  /* empty state */
  .empty {
    flex: 1; display: grid; place-items: center; color: var(--text-2);
    font-size: 12.5px; text-align: center; line-height: 1.6;
  }
  .empty[hidden] { display: none; }
  .empty .big { font-size: 26px; margin-bottom: 4px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(16px);
    background: var(--text); color: var(--surface);
    font-size: 12px; font-weight: 550;
    border-radius: 999px; padding: 7px 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .25s var(--spring);
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* theme toggle floating control (mockup chrome, not part of the app design) */
  .mockupbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px;
    font-size: 11px; color: var(--text-2);
    background: var(--surface); backdrop-filter: blur(20px);
    border-radius: 999px; padding: 6px 10px;
    box-shadow: 0 0 0 1px var(--hairline), 0 8px 24px rgba(0,0,0,.12);
    z-index: 10;
  }
  .mockupbar button { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 550; color: var(--text-2); }
  .mockupbar button.on { background: var(--text); color: var(--surface); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="mockupbar">
  <button id="themeLight" class="on">Light</button>
  <button id="themeDark">Dark</button>
  <span style="opacity:.5">·</span>
  <span>redesign mockup — click cards, pills, pin, trash, reveal</span>
</div>

<div class="window" id="win">

  <div class="titlebar">
    <span class="glow"></span>
    <h1>Clipboard</h1>
    <span class="spacer"></span>
    <span class="hotkey">Ctrl+Alt+V</span>
    <button class="iconbtn" title="Theme" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="iconbtn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
    </button>
  </div>

  <div class="searchwrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search clips" autocomplete="off">
      <span class="esc">esc</span>
    </div>
  </div>

  <div class="pills" id="pills"></div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>
    <div>
      <div class="big">⌘</div>
      No matching clips
    </div>
  </div>

  <div class="foot"><span id="count"></span></div>
</div>

<div class="toast" id="toast">Copied</div>

<script>
/* ============ sample data (shape mirrors the real ClipboardItem) ========= */
const ITEMS = [
  { id: 1, cat: "code", time: "2m", pinned: true, html: `
    <div class="codeblock mono clamped"><span class="tok-cm">// debounce — 600 lines from VS Code</span><br>
    <span class="tok-kw">function</span> <span class="tok-fn">debounce</span>(fn, <span class="tok-num">ms</span>) {<br>
    &nbsp;&nbsp;<span class="tok-kw">let</span> t; <span class="tok-cm">/* … */</span></div>` },
  { id: 2, cat: "link", time: "9m", pinned: false, html: `
    <div class="linkrow">
      <div class="favicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></div>
      <div><div style="font-size:12.5px;font-weight:550">shadcn/ui — Scroll Area</div>
      <div class="linktext" style="font-size:11px">https://ui.shadcn.com/docs/components/scroll-area</div></div>
    </div>` },
  { id: 3, cat: "color", time: "14m", pinned: false, html: `
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:#0A84FF"></div><div class="hex">0A84FF</div></div>
      <div class="swatch"><div class="chip" style="background:#FF375F"></div><div class="hex">FF375F</div></div>
      <div class="swatch"><div class="chip" style="background:#30D158"></div><div class="hex">30D158</div></div>
      <div class="swatch"><div class="chip" style="background:#FF9F0A"></div><div class="hex">FF9F0A</div></div>
    </div>` },
  { id: 4, cat: "plain", time: "26m", pinned: false, text: "Standup notes: ship the category fix, review the perf PR, ask Devhoss whether the popup should keep the hotkey chip in the title bar.", html: null },
  { id: 5, cat: "secret", time: "31m", pinned: false, secret: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJVadQssw5c" },
  { id: 6, cat: "image", time: "1h", pinned: false, html: `
    <div class="thumb"><span class="res">1423 × 812</span></div>` },
  { id: 7, cat: "email", time: "1h", pinned: false, html: `
    <div class="linkrow">
      <div class="favicon" style="background:color-mix(in srgb,var(--dot-email) 14%,transparent);color:var(--dot-email)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
      <div><div style="font-size:12.5px;font-weight:550">design@vp0.com</div>
      <div style="font-size:11px;color:var(--text-2)">Re: iOS library submission</div></div>
    </div>` },
  { id: 8, cat: "file", time: "2h", pinned: false, files: [
      ["PDF", "pitch-deck-v7.pdf", "2.4 MB"],
      ["PNG", "hero-shot-final.png", "1.1 MB"],
      ["ZIP", "assets-bundle.zip", "18.9 MB"],
  ] },
  { id: 9, cat: "code", time: "3h", pinned: false, html: `
    <div class="codeblock mono clamped"><span class="tok-cm"># Cargo.toml — thin LTO, sane link times</span><br>
    lto = <span class="tok-str">"thin"</span><br>
    opt-level = <span class="tok-num">3</span></div>` },
  { id: 10, cat: "plain", time: "5h", pinned: false, text: "Remember: the popup hides on blur, the tray icon toggles it back, and the hotkey chip is just a reminder — it is not clickable.", html: null },
];

const CATS = {
  all:    { label: "All",     single: "All",     pip: null },
  plain:  { label: "Plain",   single: "Plain",   pip: "var(--dot-plain)" },
  link:   { label: "Links",   single: "Link",    pip: "var(--dot-link)" },
  code:   { label: "Code",    single: "Code",    pip: "var(--dot-code)" },
  color:  { label: "Colors",  single: "Color",   pip: "var(--dot-color)" },
  email:  { label: "Emails",  single: "Email",   pip: "var(--dot-email)" },
  image:  { label: "Images",  single: "Image",   pip: "var(--dot-image)" },
  secret: { label: "Secrets", single: "Secret",  pip: "var(--dot-secret)" },
  file:   { label: "Files",   single: "File",    pip: "var(--dot-file)" },
};

let activeCat = "all", query = "";

/* ============ pills ====================================================== */
const pillsEl = document.getElementById("pills");
for (const [key, c] of Object.entries(CATS)) {
  const b = document.createElement("button");
  b.className = "pill" + (key === "all" ? " active" : "");
  b.dataset.cat = key;
  b.innerHTML = (c.pip ? `<span class="pip" style="background:${c.pip}"></span>` : "") + c.label;
  b.onclick = () => {
    activeCat = key;
    pillsEl.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p.dataset.cat === key));
    render();
  };
  pillsEl.appendChild(b);
}

/* ============ card rendering ============================================= */
function cardHTML(it) {
  const c = CATS[it.cat];
  let body = "";
  if (it.cat === "secret") {
    body = `
      <div class="secretbox">
        <span class="secretval" id="sv${it.id}">${it.secret}</span>
        <button class="revealbtn" onclick="event.stopPropagation(); reveal(${it.id}, this)">Show</button>
      </div>
      <div class="ttl">Auto-deletes 60s after capture</div>`;
  } else if (it.files) {
    body = it.files.map(([ext, name, size]) => `
      <div class="filerow">
        <span class="fileicon">${ext}</span>
        <span class="filename">${name}</span>
        <span class="filesize">${size}</span>
      </div>`).join("");
  } else if (it.cat === "plain") {
    body = `<div class="content clamped">${it.text}</div>`;
  } else {
    body = `<div class="content clamped">${it.html}</div>`;
  }
  return `
    <div class="meta">
      <span class="dot" style="background:${c.pip || "var(--dot-plain)"}"></span>
      <span class="cat">${c.single}</span>
      <svg class="pinflag" viewBox="0 0 24 24" fill="currentColor"><path d="M16 3v5.3l2 3.4v2.3h-5v7l-1 1-1-1v-7H6v-2.3l2-3.4V3h8z"/></svg>
      <span class="time">${it.time}</span>
      <span class="actions">
        <button class="action" title="Copy" onclick="event.stopPropagation(); copyCard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
        <button class="action ${it.pinned ? "is-pinned" : ""}" title="Pin" onclick="event.stopPropagation(); pinCard(${it.id}, this)"><svg viewBox="0 0 24 24" fill="${it.pinned ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M16 3v5.3l2 3.4v2.3h-5v7l-1 1-1-1v-7H6v-2.3l2-3.4V3h8z"/></svg></button>
        <button class="action danger" title="Delete" onclick="event.stopPropagation(); deleteCard(${it.id}, this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </span>
    </div>${body}`;
}

function render() {
  const list = document.getElementById("list");
  const q = query.toLowerCase();
  const visible = ITEMS
    .filter(it => (activeCat === "all" || it.cat === activeCat))
    .filter(it => {
      if (!q) return true;
      const hay = (it.text || it.secret || (it.files ? it.files.map(f => f[1]).join(" ") : it.html) || "").toLowerCase();
      return hay.includes(q);
    })
    .sort((a, b) => (b.pinned - a.pinned));

  list.innerHTML = "";
  visible.forEach(it => {
    const el = document.createElement("div");
    el.className = "card" + (it.pinned ? " pinned" : "");
    el.dataset.id = it.id;
    el.innerHTML = cardHTML(it);
    el.onclick = () => copyCard();
    list.appendChild(el);
  });
  document.getElementById("empty").hidden = visible.length > 0;
  document.getElementById("count").textContent =
    visible.length === ITEMS.length ? `${ITEMS.length} clips` : `${visible.length} of ${ITEMS.length} clips`;
}

/* ============ interactions =============================================== */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1300);
}
function copyCard() { toast("Copied"); }

function pinCard(id, btn) {
  const it = ITEMS.find(i => i.id === id);
  it.pinned = !it.pinned;
  render();
  toast(it.pinned ? "Pinned" : "Unpinned");
}

function deleteCard(id, btn) {
  const el = btn.closest(".card");
  el.classList.add("removing");
  const ix = ITEMS.findIndex(i => i.id === id);
  setTimeout(() => { ITEMS.splice(ix, 1); render(); }, 280);
  toast("Deleted");
}

function reveal(id, btn) {
  const val = document.getElementById("sv" + id);
  const show = !val.classList.contains("revealed");
  val.classList.toggle("revealed", show);
  btn.textContent = show ? "Hide" : "Show";
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value;
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    const s = document.getElementById("search");
    if (s.value) { s.value = ""; query = ""; render(); s.blur(); }
  }
});

/* theme */
function toggleTheme() { document.documentElement.classList.toggle("dark"); syncThemeBar(); }
function setTheme(dark) { document.documentElement.classList.toggle("dark", dark); syncThemeBar(); }
function syncThemeBar() {
  const dark = document.documentElement.classList.contains("dark");
  document.getElementById("themeDark").classList.toggle("on", dark);
  document.getElementById("themeLight").classList.toggle("on", !dark);
}
document.getElementById("themeLight").onclick = () => setTheme(false);
document.getElementById("themeDark").onclick = () => setTheme(true);

// ?dark in the URL starts in dark mode (handy for sharing/screenshots).
if (new URLSearchParams(location.search).has("dark")) {
  document.documentElement.classList.add("dark");
}
syncThemeBar();
render();
</script>
</body>
</html>
